<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="520" fill="#f5f2ea"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">Alien Human Zoo — single-room layout (top-down, not to scale)</text>
  <text x="380" y="54" text-anchor="middle" font-size="11" fill="#777">sketch stands in for the required image until a greybox screenshot exists · 2026-08-12</text>

  <!-- room -->
  <rect x="80" y="80" width="600" height="380" fill="#ece7db" stroke="#555" stroke-width="3"/>
  <text x="96" y="102" font-size="11" fill="#888">alien facility — one room, dim</text>

  <!-- question screen on back wall -->
  <rect x="270" y="88" width="220" height="34" fill="#2e2a3f" stroke="#555"/>
  <text x="380" y="110" text-anchor="middle" font-size="13" fill="#c9f">⟟⌇⌰ ☌⟒⏁ ⎅⍜⋉ ?</text>
  <text x="380" y="136" text-anchor="middle" font-size="10" fill="#666">question screen: alien symbols + shaky translation</text>

  <!-- cage -->
  <rect x="280" y="160" width="200" height="160" fill="#dff2f7" stroke="#2a7f9e" stroke-width="3"/>
  <text x="380" y="185" text-anchor="middle" font-size="12" fill="#2a7f9e" font-weight="bold">GLASS CAGE</text>
  <circle cx="380" cy="245" r="14" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="259" x2="380" y2="292" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="268" x2="362" y2="284" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="268" x2="398" y2="284" stroke="#333" stroke-width="2"/>
  <text x="380" y="310" text-anchor="middle" font-size="10" fill="#555">human (complains)</text>
  <text x="380" y="336" text-anchor="middle" font-size="10" fill="#666">consequences staged in here: turbine, fog, ice, "companion"…</text>

  <!-- meters above cage -->
  <g font-size="10" fill="#333">
    <rect x="285" y="146" width="44" height="12" fill="#fff" stroke="#888"/><text x="288" y="156">WATER</text>
    <rect x="335" y="146" width="44" height="12" fill="#fff" stroke="#888"/><text x="344" y="156">AIR</text>
    <rect x="385" y="146" width="44" height="12" fill="#fff" stroke="#888"/><text x="391" y="156">TEMP</text>
    <rect x="435" y="146" width="44" height="12" fill="#fff" stroke="#888"/><text x="438" y="156">MOOD</text>
  </g>

  <!-- console -->
  <rect x="300" y="380" width="160" height="36" rx="6" fill="#5a4f7a" stroke="#333"/>
  <circle cx="340" cy="398" r="11" fill="#e8b04b" stroke="#333"/>
  <circle cx="380" cy="398" r="11" fill="#6fc0a8" stroke="#333"/>
  <circle cx="420" cy="398" r="11" fill="#d97f7f" stroke="#333"/>
  <text x="380" y="432" text-anchor="middle" font-size="10" fill="#555">console: 2–3 glyph buttons + translated captions (the only interactable)</text>

  <!-- spawn -->
  <circle cx="380" cy="470" r="9" fill="#333"/>
  <text x="380" y="490" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">player spawn — facing console + cage</text>
  <line x1="380" y1="459" x2="380" y2="422" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- parked: translator booth -->
  <rect x="560" y="200" width="90" height="80" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="605" y="238" text-anchor="middle" font-size="10" fill="#999">translator NPC</text>
  <text x="605" y="252" text-anchor="middle" font-size="9" fill="#999">(parked idea)</text>

  <!-- sightline note -->
  <text x="140" y="440" font-size="10" fill="#666">spawn frame contains: cage + red meter</text>
  <text x="140" y="454" font-size="10" fill="#666">+ pulsing buttons — nothing to read first</text>
</svg>
